<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Agente de Ocorrências</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0f14;--bg2:#111420;--border:#1e2330;--text:#c8cdd8;--text2:#7a8299;--text3:#3a4055;--blue:#4d8eff;--green:#4ac97a;--red:#ff6b6b;--red-bg:#1a0d0d;--red-border:#ff3b3b44;--green-bg:#0d2018;--green-border:#2a8a5a;--input-bg:#0d0f14;}
.light{--bg:#f0f2f7;--bg2:#fff;--border:#d0d5e0;--text:#1a1f2e;--text2:#555e7a;--text3:#aab0c0;--blue:#2266dd;--green:#1a7a48;--red:#cc2222;--red-bg:#fff0f0;--red-border:#ffaaaa;--green-bg:#f0fff6;--green-border:#88ddaa;--input-bg:#f8f9fc;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;transition:background .2s,color .2s;}
.app{max-width:720px;margin:0 auto;padding:20px 14px 80px;}
.header{border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:20px;}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.header-right{display:flex;gap:8px;}
.header-badge{display:inline-flex;align-items:center;gap:6px;background:#ff3b3b18;border:1px solid #ff3b3b44;color:#ff6b6b;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:2px;margin-bottom:8px;}
.dot{width:6px;height:6px;background:#ff3b3b;border-radius:50%;animation:blink 1.4s ease-in-out infinite;display:inline-block;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
h1{font-size:20px;font-weight:600;color:var(--text);letter-spacing:-.5px;}
h1 span{color:var(--blue);}
.subtitle{font-size:11px;color:var(--text3);margin-top:4px;font-family:'IBM Plex Mono',monospace;}
.oc-badge{display:inline-flex;align-items:center;background:#1a1a0d;border:1px solid #4a4a1a;color:#cccc44;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:2px;margin-top:4px;}
.light .oc-badge{background:#fffff0;border-color:#aaaa44;color:#888800;}
.btn-theme,.btn-hist{background:none;border:1px solid var(--border);color:var(--text2);border-radius:4px;padding:7px 10px;font-size:13px;cursor:pointer;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.btn-hist.ativo{border-color:var(--blue);color:var(--blue);}
.groq-badge{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border);color:var(--blue);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:2px;}
.draft-banner{background:var(--green-bg);border:1px solid var(--green-border);border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:12px;color:var(--green);font-family:'IBM Plex Mono',monospace;display:flex;justify-content:space-between;align-items:center;}
.draft-discard{background:none;border:none;color:var(--red);font-size:11px;cursor:pointer;}
.terminal-bar{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.terminal-bar label{font-size:11px;color:var(--blue);font-family:'IBM Plex Mono',monospace;white-space:nowrap;text-transform:uppercase;letter-spacing:1px;}
.terminal-bar input{background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:3px 0;font-size:14px;color:var(--text);font-family:'IBM Plex Mono',monospace;outline:none;width:100%;}
.step-nav{display:flex;margin-bottom:20px;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.step-pill{flex:1;padding:8px 3px;text-align:center;font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--text3);border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.step-pill:last-child{border-right:none;}
.step-pill.done{color:#2a8a5a;background:var(--green-bg);}
.step-pill.active{color:var(--blue);background:var(--bg2);font-weight:600;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:16px;}
.card-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--blue);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.8px;}
.hint{font-size:11px;color:var(--text3);margin-bottom:5px;font-style:italic;display:block;}
input,textarea{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:16px;padding:10px 12px;outline:none;-webkit-appearance:none;transition:border-color .2s;}
input:focus,textarea:focus{border-color:var(--blue);}
input::placeholder,textarea::placeholder{color:var(--text3);}
textarea{resize:vertical;line-height:1.6;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.radio-group{display:flex;gap:8px;flex-wrap:wrap;}
.rbtn{padding:9px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;color:var(--text2);font-size:13px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
.rbtn.active{background:var(--bg2);border-color:var(--blue);color:var(--blue);}
.rbtn.danger{border-color:var(--red-border);color:#cc4444;}
.rbtn.danger.active{background:var(--red-bg);border-color:var(--red);color:var(--red);}
.dlist{display:flex;flex-direction:column;gap:10px;}
.ditem{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:12px;}
.ditem-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);}
.ditem-fields{display:grid;gap:8px;}
.ditem .field{margin-bottom:0;}
.remove-btn{background:none;border:1px solid var(--red-border);color:#7a3a3a;border-radius:3px;width:24px;height:24px;cursor:pointer;font-size:12px;}
.add-btn{background:none;border:1px dashed var(--border);color:var(--text3);border-radius:4px;padding:9px;width:100%;cursor:pointer;font-size:12px;font-family:'IBM Plex Mono',monospace;}
.nav{display:flex;justify-content:space-between;gap:12px;}
.btn{padding:12px 24px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;border:none;font-family:'IBM Plex Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text2);}
.btn-ghost:disabled{opacity:.3;cursor:not-allowed;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-gerar{background:#1a3a5a;color:#fff;width:100%;padding:14px;font-size:14px;font-weight:600;border:none;border-radius:4px;cursor:pointer;}
.light .btn-gerar{background:var(--blue);}
.loading{display:flex;align-items:center;gap:10px;color:var(--blue);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:20px 0;}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.rel-wrap{position:relative;margin:12px 0;}
.rel-ta{width:100%;background:var(--bg);border:1px solid var(--green-border);border-radius:4px;padding:16px;font-size:14px;line-height:1.9;color:var(--text);font-family:'IBM Plex Sans',sans-serif;resize:vertical;outline:none;min-height:180px;}
.edit-badge{position:absolute;top:8px;right:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);padding:2px 8px;border-radius:2px;pointer-events:none;}
.action-bar{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.btn-wa{background:#0d2a1a;border:1px solid #25d36644;color:#25d366;padding:12px;border-radius:4px;font-size:13px;font-family:'IBM Plex Mono',monospace;cursor:pointer;text-align:center;width:100%;}
.light .btn-wa{background:#e8fff2;border-color:#25d36688;}
.btn-pdf{background:var(--bg2);border:1px solid var(--blue);color:var(--blue);padding:12px;border-radius:4px;font-size:13px;font-family:'IBM Plex Mono',monospace;cursor:pointer;text-align:center;width:100%;}
.btn-rst{background:none;border:1px solid var(--border);color:var(--text2);padding:10px;border-radius:4px;font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;text-align:center;width:100%;}
.samu-sec{border-top:1px solid var(--border);padding-top:16px;margin-top:4px;}
.api-box{background:var(--bg2);border:1px solid #4d8eff33;border-radius:6px;padding:16px;margin-bottom:16px;}
.api-box p{font-size:13px;color:var(--text2);margin-bottom:10px;line-height:1.7;}
.api-box a{color:var(--blue);}
.key-row{display:flex;gap:8px;}
.btn-save{background:var(--blue);color:#fff;border:none;border-radius:4px;padding:10px 14px;font-size:13px;cursor:pointer;white-space:nowrap;}
.btn-save:disabled{opacity:.4;}
.key-change{font-size:11px;color:var(--text3);cursor:pointer;font-family:'IBM Plex Mono',monospace;background:none;border:none;text-decoration:underline;margin-bottom:12px;display:block;}
.alerta{background:var(--red-bg);border:1px solid var(--red-border);border-radius:4px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--red);line-height:1.6;}
.erro{color:var(--red);font-size:13px;padding:12px;background:var(--red-bg);border:1px solid var(--red-border);border-radius:4px;line-height:1.6;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--green-bg);border:1px solid var(--green-border);color:var(--green);font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 24px;border-radius:6px;z-index:999;white-space:nowrap;box-shadow:0 4px 20px #00000044;}
.hist-vazio{text-align:center;padding:32px;color:var(--text3);font-family:'IBM Plex Mono',monospace;font-size:13px;}
.hist-item{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:14px;margin-bottom:10px;}
.hist-item-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
.hist-item-nome{font-weight:600;color:var(--text);font-size:14px;}
.hist-item-oc{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#cccc44;}
.hist-item-data{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text3);}
.hist-item-meta{font-size:12px;color:var(--text2);line-height:1.6;}
.hist-item-actions{display:flex;gap:8px;margin-top:10px;}
.btn-hv{background:var(--bg2);border:1px solid var(--blue);color:var(--blue);padding:6px 12px;border-radius:3px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
.btn-hd{background:none;border:1px solid var(--red-border);color:#7a3a3a;padding:6px 12px;border-radius:3px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
.hist-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);margin-bottom:12px;}
.overlay{position:fixed;inset:0;background:#00000099;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:8px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;padding:20px;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.modal-title{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--blue);font-weight:600;}
.modal-close{background:none;border:1px solid var(--border);color:var(--text2);border-radius:3px;width:28px;height:28px;cursor:pointer;font-size:14px;}
.foto-lbl{font-size:12px;color:var(--text3);font-family:'IBM Plex Mono',monospace;display:block;cursor:pointer;}
.foto-lbl input{display:none;}
.foto-area{border:1px dashed var(--border);border-radius:4px;padding:14px;text-align:center;margin-bottom:8px;}
.foto-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.foto-item{position:relative;border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.foto-item img{width:100%;height:110px;object-fit:cover;display:block;}
.foto-rm{position:absolute;top:4px;right:4px;background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);border-radius:3px;width:22px;height:22px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
.fotos-sec-lbl{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.8px;display:block;}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Storage helpers ────────────────────────────────────────────────────────
var HIST_KEY="ocorrencias_historico", TERM_KEY="ocorrencias_terminal",
    GROQ_KEY="groq_key", DRAFT_KEY="ocorrencias_rascunho",
    STEP_KEY="ocorrencias_step", OC_KEY="ocorrencias_contador",
    THEME_KEY="ocorrencias_tema";

function ls(k,d){try{return localStorage.getItem(k)||d;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch{}}
function lsRm(k){try{localStorage.removeItem(k);}catch{}}
function lsJSON(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function lsJSONSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

function horaAtual(){var d=new Date();return String(d.getHours()).padStart(2,"0")+"h"+String(d.getMinutes()).padStart(2,"0");}
function proxOC(){try{var n=parseInt(ls(OC_KEY,"0"))+1;lsSet(OC_KEY,String(n));return "OC-"+String(n).padStart(3,"0");}catch{return "OC-001";}}

function emptyForm(){return {
  horarioOcorrencia:horaAtual(),nomeUsuario:"",rgUsuario:"",cpfUsuario:"",idadeUsuario:"",
  localOcorrencia:"",quemChamou:"",sinaisVitais:"",situacaoUsuario:"",
  precisaCadeira:"nao",consciente:"sim",nivelConsciente:"",aceitaConducao:"sim",
  hospitalDestino:"",numeroOC:"",
  equipe:[{nome:"",cargo:"",re:""}],
  samuSolicitado:"nao",horarioSamuContato:"",atendenteSamu:"",protocoloSamu:"",
  horarioChegadaSamu:"",horarioSaidaSamu:"",placaAmbu:"",prefixoAmbu:"",
  equipeSamu:[{nome:"",funcao:"",recrea:""}],
  horarioFinalizacao:"",cientes:[{nome:"",cargo:"",re:""}],observacoesFinais:"",fotos:[]
};}

// ── PDF generator ──────────────────────────────────────────────────────────
function gerarPDF(relatorio, fotos, terminal, nomeUsuario, numeroOC, cb) {
  try {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    var pw = doc.internal.pageSize.getWidth();
    var ph = doc.internal.pageSize.getHeight();
    var mg = 20, uw = pw - mg*2, y = mg;

    // Header
    doc.setFont("times","bold"); doc.setFontSize(14);
    doc.text(terminal||"Relatório de Ocorrência", pw/2, y, {align:"center"}); y+=7;
    doc.setFont("times","normal"); doc.setFontSize(10);
    doc.text((numeroOC?numeroOC+" — ":"")+nomeUsuario+" — "+new Date().toLocaleString("pt-BR"), pw/2, y, {align:"center"}); y+=4;
    doc.setDrawColor(0); doc.setLineWidth(0.5);
    doc.line(mg, y, pw-mg, y); y+=8;

    // Body
    doc.setFont("times","normal"); doc.setFontSize(12);
    var paras = relatorio.split("\n\n");
    paras.forEach(function(p){
      if(!p.trim()) return;
      var lines = doc.splitTextToSize(p.trim(), uw);
      lines.forEach(function(l){
        if(y+7>ph-mg){doc.addPage();y=mg;}
        doc.text(l,mg,y); y+=7;
      });
      y+=3;
    });

    // Fotos
    if(fotos&&fotos.length>0){
      y+=6;
      if(y+12>ph-mg){doc.addPage();y=mg;}
      doc.setFont("helvetica","bold"); doc.setFontSize(9);
      doc.text("REGISTROS FOTOGRÁFICOS",mg,y); y+=2;
      doc.setLineWidth(0.3); doc.line(mg,y,pw-mg,y); y+=8;
      var fw=(uw-8)/2, fh=fw*0.65;
      fotos.forEach(function(foto,i){
        var x=mg+(i%2)*(fw+8);
        if(i%2===0&&i>0){y+=fh+12;}
        if(y+fh+10>ph-mg){doc.addPage();y=mg;}
        try{
          var ext=foto.data.indexOf("png")>-1?"PNG":"JPEG";
          doc.addImage(foto.data,ext,x,y,fw,fh);
          doc.setFont("helvetica","normal"); doc.setFontSize(9);
          doc.text("Foto "+(i+1),x+fw/2,y+fh+5,{align:"center"});
        }catch(e){
          doc.setFont("helvetica","italic"); doc.setFontSize(9);
          doc.text("[Foto "+(i+1)+"]",x,y+fh/2);
        }
      });
    }

    var fname=(numeroOC||"relatorio")+"-ocorrencia.pdf";
    // Tenta Web Share (Android)
    var blob = doc.output("blob");
    var file = new File([blob], fname, {type:"application/pdf"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"Relatório de Ocorrência"})
        .then(function(){if(cb)cb("✓ PDF compartilhado!");})
        .catch(function(){if(cb)cb("Cancelado.");});
    } else {
      // Download direto
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url; a.download=fname;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},3000);
      if(cb)cb("⬇ PDF baixado!");
    }
  } catch(err){if(cb)cb("Erro PDF: "+err.message);}
}

// ── API Groq ───────────────────────────────────────────────────────────────
async function chamarGroq(apiKey, form, terminal){
  var inc=form.consciente==="nao";
  var eq=form.equipe.filter(function(e){return e.nome;}).map(function(e){return "- "+e.cargo+": "+e.nome+", RE "+e.re;}).join("\n")||"- Não informado";
  var samu=form.samuSolicitado==="sim"
    ?"- Sim\n- Contato: "+form.horarioSamuContato+"\n- Atendente: "+form.atendenteSamu+"\n- Protocolo: "+form.protocoloSamu+"\n- Chegada: "+form.horarioChegadaSamu+"\n- Saída: "+form.horarioSaidaSamu+"\n- Placa: "+form.placaAmbu+" | Prefixo: "+form.prefixoAmbu+"\n- Equipe: "+form.equipeSamu.filter(function(e){return e.nome;}).map(function(e){return e.funcao+" "+e.nome+", RE/CREA "+e.recrea;}).join("; ")
    :"- Não solicitado";
  var cientes=form.cientes.filter(function(c){return c.nome;}).map(function(c){return "- "+c.cargo+" "+c.nome+" – RE "+c.re;}).join("\n")||"- Não informado";

  var prompt="Você é um agente especializado em redigir relatórios de ocorrências de mal súbito em terminais de transporte público.\n\nRedija um relatório formal em português, em parágrafos corridos, sem listas, sem markdown, sem asteriscos e sem títulos. Linguagem institucional, objetiva e juridicamente segura.\n\nREGRAS:\n1. Nunca afirme diagnósticos. Use \"relatando\", \"queixando-se de\" para conscientes.\n2. INCONSCIENTE: linguagem observacional. Nunca \"queixando-se\". Nunca aceite de condução.\n3. Não mencione idade salvo se relevante.\n4. CPF informado: inclua junto ao RG: \"portador do RG nº X e CPF nº Y\".\n5. Use \"aceitou ser conduzido\".\n6. Sinais vitais não aferidos: registre \"não foram aferidos os sinais vitais do usuário.\"\n7. Encerramento objetivo.\n8. INCONSCIENTE: SAMU como acionamento imediato.\n\n"+(terminal?"TERMINAL: "+terminal+"\n":"")+"CONSCIÊNCIA: "+(inc?"INCONSCIENTE":"CONSCIENTE")+"\n\nDADOS:\n- Nº: "+(form.numeroOC||"—")+"\n- Horário: "+form.horarioOcorrencia+"\n- Nome: "+form.nomeUsuario+"\n- RG: "+(form.rgUsuario||"não informado")+"\n- CPF: "+(form.cpfUsuario||"não informado")+"\n- Local: "+form.localOcorrencia+"\n- Identificação: "+(form.quemChamou||"não informado")+"\n\nCLÍNICO:\n- "+(inc?"Observado":"Relatado")+": "+form.situacaoUsuario+"\n- Sinais: "+(form.sinaisVitais||"não aferidos")+"\n- Cadeira: "+(form.precisaCadeira==="sim"?"Sim":"Não")+"\n"+(inc?"- Inconsciente":"- Consciência: "+(form.nivelConsciente||"orientado")+"\n- Condução: "+(form.aceitaConducao==="sim"?"Aceitou":form.aceitaConducao==="nao"?"Recusou":"N/A"))+"\n- Destino: "+(form.hospitalDestino||"não informado")+"\n\nEQUIPE:\n"+eq+"\n\nSAMU:\n"+samu+"\n\nDESFECHO:\n- Finalização: "+(form.horarioFinalizacao||"não informado")+"\n- Obs: "+(form.observacoesFinais||"nenhuma")+"\n\nCIENTES:\n"+cientes+"\n\nEscreva APENAS o relatório. Sem markdown. Ao final: \"Ocorrência finalizada às [horário].\" e cientes.";

  var res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},
    body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"user",content:prompt}],temperature:0.3,max_tokens:1200})
  });
  var data=await res.json();
  if(data.error) throw new Error(data.error.message);
  var text=data&&data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
  if(!text) throw new Error("Resposta vazia.");
  return text.replace(/\*\*/g,"").replace(/\*/g,"").replace(/^#+\s/gm,"").trim();
}

function el(tag,props,children){
  var e=document.createElement(tag);
  if(props) Object.keys(props).forEach(function(k){
    if(k==="className") e.className=props[k];
    else if(k==="style"&&typeof props[k]==="object") Object.assign(e.style,props[k]);
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(),props[k]);
    else if(k==="htmlFor") e.htmlFor=props[k];
    else e[k]=props[k];
  });
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c==null||c===false) return;
      e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);
    });
  }
  return e;
}

function inp(label,val,onChange,ph,hint){

  i.dataset.fid=fid;
  i.addEventListener("input",function(){onChange(i.value);});

  return d;
}

function dlist(items,onChange,fields,addLabel,cols){
  // onChange(newItems, silent) - silent=true means no full re-render
  var wrap=el("div",{className:"dlist"});
  var colStyle=cols||(fields.length===2?"1fr 1fr":"1fr 1fr 1fr");

  function rebuild(){
    wrap.innerHTML="";
    items.forEach(function(item,i){
      var div=el("div",{className:"ditem"});
      var hdr=el("div",{className:"ditem-hdr"},["#"+(i+1)]);
      if(items.length>1){
        var rb=el("button",{className:"remove-btn",type:"button"},"✕");
        rb.addEventListener("click",function(){items.splice(i,1);onChange(items.slice(),false);rebuild();});
        hdr.appendChild(rb);
      }
      div.appendChild(hdr);
      var fg=el("div",{className:"ditem-fields",style:{gridTemplateColumns:colStyle}});
      fields.forEach(function(f){
        var fd=el("div",{className:"field"});
        fd.appendChild(el("label",null,f.label));
        var inp2=document.createElement("input");
        inp2.type="text"; inp2.value=item[f.key]||""; inp2.placeholder=f.ph||f.label;
        inp2.dataset.fid="dl-"+(++_inpCounter);
        inp2.addEventListener("input",function(){item[f.key]=inp2.value;onChange(items.slice(),true);var btn=document.querySelector(".btn-primary");if(btn)btn.disabled=!canNext();});
        fd.appendChild(inp2);
        fg.appendChild(fd);
      });
      div.appendChild(fg);
      wrap.appendChild(div);
    });
    var ab=el("button",{className:"add-btn",type:"button"},"+ "+addLabel);
    ab.addEventListener("click",function(){
      var ni={};fields.forEach(function(f){ni[f.key]="";});
      items.push(ni);onChange(items.slice(),false);rebuild();
    });
    wrap.appendChild(ab);
  }
  rebuild();
  return wrap;
}

function fotoUpload(fotos,onChange){
  var wrap=el("div",{className:"field"});
  wrap.appendChild(el("label",null,"Fotos da Ocorrência (máx. 2)"));

  function rebuild(){
    var old=wrap.querySelector(".foto-content");
    if(old) old.remove();
    var cont=el("div",{className:"foto-content"});
    if(fotos.length<2){
      var lbl=el("label",{className:"foto-lbl"});
      lbl.appendChild(el("div",{className:"foto-area"},"📷 Câmera ou Galeria"));
      var fi=el("input",{type:"file",accept:"image/*",multiple:fotos.length===0});
      fi.addEventListener("change",function(){
        var files=Array.from(fi.files);
        var rem=2-fotos.length;
        files.slice(0,rem).forEach(function(file){
          var r=new FileReader();
          r.onload=function(ev){fotos.push({data:ev.target.result,nome:file.name});onChange(fotos.slice());rebuild();};
          r.readAsDataURL(file);
        });
        fi.value="";
      });
      lbl.appendChild(fi);
      cont.appendChild(lbl);
    }
    if(fotos.length>0){
      var grid=el("div",{className:"foto-grid"});
      fotos.forEach(function(foto,idx){
        var item=el("div",{className:"foto-item"});
        var img=el("img",{src:foto.data,alt:"Foto "+(idx+1)});
        var rm=el("button",{className:"foto-rm",type:"button"},"✕");
        rm.addEventListener("click",function(){fotos.splice(idx,1);onChange(fotos.slice());rebuild();});
        item.appendChild(img);
        item.appendChild(rm);
        grid.appendChild(item);
      });
      cont.appendChild(grid);
    }
    wrap.appendChild(cont);
  }
  rebuild();
  return wrap;
}

function showToast(msg){
  var old=document.querySelector(".toast");
  if(old) old.remove();
  var t=el("div",{className:"toast"},msg);
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},2500);
}

function render(){

    var el2=app.querySelector("[data-fid='"+focusedId+"']");
    if(el2){el2.focus();if(focusedPos!==null&&el2.setSelectionRange)el2.setSelectionRange(focusedPos,focusedPos);}

        db.appendChild(dd);

    }

    // Step nav
    var sn=el("div",{className:"step-nav"});
    STEPS.forEach(function(s,i){
      sn.appendChild(el("div",{className:"step-pill"+(i<STATE.step?" done":i===STATE.step?" active":"")},(i<STATE.step?"✓ ":""+(i+1)+" ")+s));
    });
    wrap.appendChild(sn);

    // Steps
    if(STATE.step===0) wrap.appendChild(buildStep0());
    if(STATE.step===1) wrap.appendChild(buildStep1());
    if(STATE.step===2) wrap.appendChild(buildStep2());
    if(STATE.step===3) wrap.appendChild(buildStep3());
    if(STATE.step===4) wrap.appendChild(buildStep4());
    if(STATE.step===5) wrap.appendChild(buildStep5());

    // Nav buttons
    if(STATE.step<5){
      var nav=el("div",{className:"nav"});
      var back=el("button",{className:"btn btn-ghost"},"← Voltar");
      back.disabled=STATE.step===0;

      var next=el("button",{className:"btn btn-primary"},STATE.step===4?"Gerar Relatório →":"Próximo →");
      next.disabled=!canNext();
      next.addEventListener("click",function(){
        if(STATE.step===4){lsSet(STEP_KEY,"5");setState({step:5});setTimeout(gerarRelatorio,100);}
        else{var n=STATE.step+1;lsSet(STEP_KEY,String(n));setState({step:n});}
      });
      nav.appendChild(back); nav.appendChild(next);
      wrap.appendChild(nav);
    }
  }

  if(STATE.tela==="historico") wrap.appendChild(buildHistorico());

  // Modal
  if(STATE.histModal) wrap.appendChild(buildModal(STATE.histModal));

  return wrap;
}

function updateForm(k,v){
  STATE.form[k]=v;
  lsJSONSet(DRAFT_KEY,STATE.form);
  // Update next button state without full re-render
  var btn=document.querySelector(".btn-primary");
  if(btn) btn.disabled=!canNext();
}

function canNext(){
  if(STATE.step===0) return STATE.form.horarioOcorrencia&&STATE.form.nomeUsuario&&STATE.form.localOcorrencia;
  if(STATE.step===1) return STATE.form.situacaoUsuario;
  if(STATE.step===2) return STATE.form.equipe[0]&&STATE.form.equipe[0].nome;
  return true;
}

async function gerarRelatorio(){
  if(!STATE.apiKey){setState({showKey:true});return;}
  var oc=STATE.form.numeroOC||proxOC();
  STATE.form.numeroOC=oc;
  setState({loading:true,erro:"",relatorio:""});
  try{
    var texto=await chamarGroq(STATE.apiKey,STATE.form,STATE.terminal);
    lsRm(DRAFT_KEY); lsRm(STEP_KEY);
    var hist=lsJSON(HIST_KEY,[]);
    hist.push({id:Date.now(),numeroOC:oc,data:new Date().toLocaleString("pt-BR"),nomeUsuario:STATE.form.nomeUsuario,horario:STATE.form.horarioOcorrencia,local:STATE.form.localOcorrencia,terminal:STATE.terminal,relatorio:texto,inconsciente:STATE.form.consciente==="nao",fotos:STATE.form.fotos||[]});
    lsJSONSet(HIST_KEY,hist);
    setState({loading:false,relatorio:texto,hasDraft:false});
  }catch(e){setState({loading:false,erro:"Erro: "+e.message});}
}

    sec.appendChild(fd);
    sec.appendChild(dlist(STATE.form.equipeSamu,function(v,silent){updateForm("equipeSamu",v);if(!silent)render();},[{key:"funcao",label:"Função",ph:"Médico, Enfermeira"},{key:"nome",label:"Nome",ph:"Nome completo"},{key:"recrea",label:"RE/CREA",ph:"23.633.229-06"}],"Adicionar membro"));
    c.appendChild(sec);
  }
  return c;
}

function buildStep4(){
  var c=el("div",{className:"card"});
  c.appendChild(el("div",{className:"card-title"},"Desfecho & Cientes"));
  c.appendChild(inp("Horário de finalização",STATE.form.horarioFinalizacao,function(v){updateForm("horarioFinalizacao",v);},"Ex: 02h54"));
  c.appendChild(ta("Observações finais",STATE.form.observacoesFinais,function(v){updateForm("observacoesFinais",v);},"Informações adicionais relevantes..."));
  var fd=el("div",{className:"field",style:{marginTop:"8px"}});
  fd.appendChild(el("label",null,"Cientes da ocorrência"));
  c.appendChild(fd);
  c.appendChild(dlist(STATE.form.cientes,function(v,silent){updateForm("cientes",v);if(!silent)render();},[{key:"cargo",label:"Cargo",ph:"E.T., Supervisor"},{key:"nome",label:"Nome",ph:"Nome completo"},{key:"re",label:"RE",ph:"Ex: 111"}],"Adicionar ciente"));
  c.appendChild(fotoUpload(STATE.form.fotos,function(v){updateForm("fotos",v);render();}));
  return c;
}

function buildStep5(){
  var c=el("div",{className:"card"});
  c.appendChild(el("div",{className:"card-title"},"Relatório Final"));
  if(STATE.loading){
    var ld=el("div",{className:"loading"});
    ld.appendChild(el("div",{className:"spinner"}));
    ld.appendChild(document.createTextNode("Gerando relatório..."));
    c.appendChild(ld);
  }
  if(STATE.erro){
    c.appendChild(el("div",{className:"erro"},STATE.erro));
    var rt=el("button",{className:"btn-gerar",style:{marginTop:"10px"}},"Tentar novamente");
    rt.addEventListener("click",gerarRelatorio);
    c.appendChild(rt);
  }
  if(STATE.relatorio){
    var rw=el("div",{className:"rel-wrap"});
    var rta=el("textarea",{className:"rel-ta"});
    rta.value=STATE.relatorio;
    rta.addEventListener("input",function(){STATE.relatorio=rta.value;/* no render */});
    rw.appendChild(rta);
    rw.appendChild(el("span",{className:"edit-badge"},"editável"));
    c.appendChild(rw);
    if(STATE.form.fotos&&STATE.form.fotos.length>0){
      var fsl=el("div",{style:{marginBottom:"12px"}});
      fsl.appendChild(el("span",{className:"fotos-sec-lbl"},"Fotos registradas"));
      var fg=el("div",{className:"foto-grid"});
      STATE.form.fotos.forEach(function(foto,idx){
        var fi=el("div",{className:"foto-item"});
        fi.appendChild(el("img",{src:foto.data,alt:"Foto "+(idx+1)}));
        fg.appendChild(fi);
      });
      fsl.appendChild(fg);
      c.appendChild(fsl);
    }
    var ab=el("div",{className:"action-bar"});
    var bpdf=el("button",{className:"btn-pdf"},"⬇ Baixar PDF");
    bpdf.addEventListener("click",function(){
      gerarPDF(STATE.relatorio,STATE.form.fotos||[],STATE.terminal,STATE.form.nomeUsuario,STATE.form.numeroOC,showToast);
    });
    var bwa=el("button",{className:"btn-wa"},"📲 Enviar WhatsApp");
    bwa.addEventListener("click",function(){window.open("https://wa.me/?text="+encodeURIComponent("📋 *Relatório de Ocorrência*\n\n"+STATE.relatorio),"_blank");});
    var bhist=el("button",{className:"btn-rst"},"Ver histórico");
    bhist.addEventListener("click",function(){setState({tela:"historico"});});
    var bnova=el("button",{className:"btn-rst"},"Nova ocorrência");
    bnova.addEventListener("click",function(){lsRm(DRAFT_KEY);lsRm(STEP_KEY);setState({step:0,form:emptyForm(),relatorio:"",erro:"",hasDraft:false,tela:"form"});});
    ab.appendChild(bpdf); ab.appendChild(bwa); ab.appendChild(bhist); ab.appendChild(bnova);
    c.appendChild(ab);
  }
  if(!STATE.loading&&!STATE.relatorio&&!STATE.erro){
    var bg=el("button",{className:"btn-gerar"},"⚡ Gerar Relatório com Groq");
    bg.addEventListener("click",gerarRelatorio);
    c.appendChild(bg);
  }
  return c;
}

function buildHistorico(){
  var lista=lsJSON(HIST_KEY,[]);
  var wrap=el("div",null);
  var c=el("div",{className:"card"});
  c.appendChild(el("div",{className:"card-title"},"Histórico de Ocorrências"));
  if(lista.length===0){
    c.appendChild(el("div",{className:"hist-vazio"},"Nenhuma ocorrência salva ainda."));
  } else {
    c.appendChild(el("div",{className:"hist-count"},lista.length+" ocorrência"+(lista.length!==1?"s":"")+" salva"+(lista.length!==1?"s":"")));
    lista.slice().reverse().forEach(function(item){
      var hi=el("div",{className:"hist-item"});
      var hh=el("div",{className:"hist-item-hdr"});
      var hl=el("div",null);
      hl.appendChild(el("div",{className:"hist-item-nome"},item.nomeUsuario));
      if(item.numeroOC) hl.appendChild(el("div",{className:"hist-item-oc"},item.numeroOC));
      hh.appendChild(hl);
      hh.appendChild(el("div",{className:"hist-item-data"},item.data));
      hi.appendChild(hh);
      hi.appendChild(el("div",{className:"hist-item-meta"},(item.terminal?"📍 "+item.terminal+" · ":"")+"🕐 "+item.horario+" · 📌 "+item.local+(item.inconsciente?" · ⚠ Inconsciente":"")+(item.fotos&&item.fotos.length>0?" · 📷 "+item.fotos.length:"") ));
      var ha=el("div",{className:"hist-item-actions"});
      var bv=el("button",{className:"btn-hv"},"Ver / Editar");
      bv.addEventListener("click",function(){setState({histModal:item});});
      var bd=el("button",{className:"btn-hd"},"Excluir");
      bd.addEventListener("click",function(){
        if(!window.confirm("Excluir?")) return;
        var nl=lsJSON(HIST_KEY,[]).filter(function(i){return i.id!==item.id;});
        lsJSONSet(HIST_KEY,nl);render();
      });
      ha.appendChild(bv); ha.appendChild(bd);
      hi.appendChild(ha);
      c.appendChild(hi);
    });
    var clr=el("button",{className:"btn-rst",style:{marginTop:"12px"}},"Limpar histórico");
    clr.addEventListener("click",function(){if(!window.confirm("Limpar tudo?"))return;lsJSONSet(HIST_KEY,[]);render();});
    c.appendChild(clr);
  }
  wrap.appendChild(c);
  var bnova=el("button",{className:"btn btn-primary",style:{width:"100%",padding:"13px"}},"+ Nova Ocorrência");
  bnova.addEventListener("click",function(){lsRm(DRAFT_KEY);lsRm(STEP_KEY);setState({tela:"form",step:0,form:emptyForm(),relatorio:"",erro:"",hasDraft:false});});
  wrap.appendChild(bnova);
  return wrap;
}

function buildModal(item){
  var relText=item.relatorio;
  var ov=el("div",{className:"overlay"});
  ov.addEventListener("click",function(){setState({histModal:null});});
  var modal=el("div",{className:"modal"});
  modal.addEventListener("click",function(e){e.stopPropagation();});
  var mh=el("div",{className:"modal-hdr"});
  mh.appendChild(el("span",{className:"modal-title"},(item.numeroOC||"RELATÓRIO")+" — "+item.data));
  var mc=el("button",{className:"modal-close"},"✕");
  mc.addEventListener("click",function(){setState({histModal:null});});
  mh.appendChild(mc);
  modal.appendChild(mh);
  modal.appendChild(el("div",{style:{fontSize:"12px",color:"var(--text2)",marginBottom:"10px",fontFamily:"monospace"}},item.nomeUsuario+(item.inconsciente?" · ⚠ Inconsciente":"")));
  var rw=el("div",{className:"rel-wrap"});
  var rta=el("textarea",{className:"rel-ta"});
  rta.value=relText;
  rta.addEventListener("input",function(){relText=rta.value;/* no render */});
  rw.appendChild(rta);
  rw.appendChild(el("span",{className:"edit-badge"},"editável"));
  modal.appendChild(rw);
  if(item.fotos&&item.fotos.length>0){
    var fs=el("div",{style:{marginBottom:"12px"}});
    fs.appendChild(el("span",{className:"fotos-sec-lbl"},"Fotos registradas"));
    var fg=el("div",{className:"foto-grid"});
    item.fotos.forEach(function(foto,idx){
      var fi=el("div",{className:"foto-item"});
      fi.appendChild(el("img",{src:foto.data,alt:"Foto "+(idx+1)}));
      fg.appendChild(fi);
    });
    fs.appendChild(fg);
    modal.appendChild(fs);
  }
  var ab=el("div",{className:"action-bar"});
  var bpdf=el("button",{className:"btn-pdf"},"⬇ Baixar PDF");
  bpdf.addEventListener("click",function(){gerarPDF(relText,item.fotos||[],item.terminal,item.nomeUsuario,item.numeroOC,showToast);});
  var bwa=el("button",{className:"btn-wa"},"📲 Enviar WhatsApp");
  bwa.addEventListener("click",function(){window.open("https://wa.me/?text="+encodeURIComponent("📋 *Relatório de Ocorrência*\n\n"+relText),"_blank");});
  ab.appendChild(bpdf); ab.appendChild(bwa);
  modal.appendChild(ab);
  ov.appendChild(modal);
  return ov;
}

// ── INIT ───────────────────────────────────────────────────────────────────
render();
</script>
</body>
