<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0f14; color: #c8cdd8; font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; }

  .header { border-bottom: 1px solid #1e2330; padding-bottom: 20px; margin-bottom: 28px; }

  .btn-historico { background:none; border:1px solid #1e2330; color:#5a6278; border-radius:4px; padding:8px 14px; font-size:12px; font-family:'IBM Plex Mono',monospace; cursor:pointer; white-space:nowrap; }
  .btn-historico.ativo { border-color:#4d8eff; color:#4d8eff; background:#0d1a33; }
  .draft-banner { background:#0d2018; border:1px solid #2a5a3a; border-radius:4px; padding:8px 12px; margin-bottom:16px; font-size:12px; color:#4ac97a; font-family:'IBM Plex Mono',monospace; display:flex; justify-content:space-between; align-items:center; }

  .step-pill { flex:1; padding:8px 4px; text-align:center; font-size:10px; font-family:'IBM Plex Mono',monospace; color:#3a4055; border-right:1px solid #1e2330; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .step-pill:last-child { border-right:none; }
  .step-pill.done { color:#2a8a5a; background:#0d2018; }

  .card { background:#111420; border:1px solid #1e2330; border-radius:6px; padding:24px; margin-bottom:20px; }
  .card-title { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:#4d8eff; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; display:flex; align-items:center; gap:8px; }

  .list-item-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#3a4055; }
  .list-item-fields { display:grid; gap:10px; }
  .list-item .field { margin-bottom:0; }
  .remove-btn { background:none; border:1px solid #3a2222; color:#7a3a3a; border-radius:3px; width:22px; height:22px; cursor:pointer; font-size:10px; }
  .add-btn { background:none; border:1px dashed #1e2330; color:#3a4a6a; border-radius:4px; padding:9px; width:100%; cursor:pointer; font-size:12px; font-family:'IBM Plex Mono',monospace; }
  .nav { display:flex; justify-content:space-between; gap:12px; }

  .btn-copy { background:#0d2018; border:1px solid #2a8a5a; color:#4ac97a; padding:9px 16px; border-radius:4px; font-size:12px; font-family:'IBM Plex Mono',monospace; cursor:pointer; }
  .btn-reset { background:none; border:1px solid #1e2330; color:#5a6278; padding:9px 16px; border-radius:4px; font-size:12px; font-family:'IBM Plex Mono',monospace; cursor:pointer; }
  .samu-section { border-top:1px solid #1e2330; padding-top:20px; margin-top:4px; }

  .terminal-bar { background:#0d1220; border:1px solid #1e2a3a; border-radius:4px; padding:12px 16px; margin-bottom:20px; display:flex; align-items:center; gap:12px; }
  .terminal-bar label { font-size:11px; color:#4d6a8a; font-family:'IBM Plex Mono',monospace; white-space:nowrap; text-transform:uppercase; letter-spacing:1px; }
  .terminal-bar input { background:transparent; border:none; border-bottom:1px solid #1e2a3a; border-radius:0; padding:4px 0; font-size:13px; color:#8ab4ff; font-family:'IBM Plex Mono',monospace; }
  .terminal-bar input:focus { border-bottom-color:#4d8eff; outline:none; }
  .alerta { background:#1a0d0d; border:1px solid #ff3b3b44; border-radius:4px; padding:12px 14px; margin-bottom:16px; font-size:13px; color:#ff8888; line-height:1.6; }
  .alerta strong { color:#ff6b6b; }
  .erro { color:#ff6b6b; font-size:13px; padding:12px; background:#1a0d0d; border:1px solid #ff3b3b44; border-radius:4px; line-height:1.6; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a4a2a; border:1px solid #2a8a5a; color:#4ac97a; font-family:'IBM Plex Mono',monospace; font-size:13px; padding:10px 24px; border-radius:6px; z-index:999; white-space:nowrap; }
  .hist-vazio { text-align:center; padding:32px; color:#3a4055; font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .hist-item { background:#0d0f14; border:1px solid #1e2330; border-radius:4px; padding:16px; margin-bottom:12px; }
  .hist-item-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .hist-item-nome { font-weight:600; color:#eef0f6; font-size:14px; }
  .hist-item-data { font-family:'IBM Plex Mono',monospace; font-size:10px; color:#3a4055; white-space:nowrap; }
  .hist-item-meta { font-size:12px; color:#5a6278; }
  .hist-item-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn-hist-ver { background:#0d1a33; border:1px solid #2a4a6a; color:#4d8eff; padding:6px 12px; border-radius:3px; font-size:11px; font-family:'IBM Plex Mono',monospace; cursor:pointer; }
  .btn-hist-del { background:none; border:1px solid #3a2222; color:#7a3a3a; padding:6px 12px; border-radius:3px; font-size:11px; font-family:'IBM Plex Mono',monospace; cursor:pointer; }
  .hist-count { font-family:'IBM Plex Mono',monospace; font-size:11px; color:#3a4055; margin-bottom:16px; }
  .modal-overlay { position:fixed; inset:0; background:#00000099; z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal { background:#111420; border:1px solid #1e2330; border-radius:8px; max-width:680px; width:100%; max-height:90vh; overflow-y:auto; padding:24px; }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-title { font-family:'IBM Plex Mono',monospace; font-size:12px; color:#4d8eff; font-weight:600; letter-spacing:1px; }
  .modal-close { background:none; border:1px solid #1e2330; color:#5a6278; border-radius:3px; width:28px; height:28px; cursor:pointer; font-size:14px; }
  @media(max-width:540px){ .row-2{grid-template-columns:1fr} .step-pill{font-size:8px;padding:6px 2px} .action-bar{flex-direction:column} .action-bar button{width:100%;text-align:center;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const STEPS = ["Dados do Usuário","Estado Clínico","Equipe","SAMU","Desfecho","Relatório"];
const HIST_KEY = "ocorrencias_historico";
const TERM_KEY = "ocorrencias_terminal";
const GROQ_KEY = "groq_key";
const DRAFT_KEY = "ocorrencias_rascunho";
const STEP_KEY = "ocorrencias_step";

const emptyForm = () => ({
  horarioOcorrencia:"", nomeUsuario:"", rgUsuario:"", cpfUsuario:"", idadeUsuario:"",
  localOcorrencia:"", quemChamou:"", sinaisVitais:"", situacaoUsuario:"",
  precisaCadeira:"nao", consciente:"sim", nivelConsciente:"", aceitaConducao:"sim", hospitalDestino:"",
  equipe:[{nome:"",cargo:"",re:""}],
  samuSolicitado:"nao", horarioSamuContato:"", atendenteSamu:"", protocoloSamu:"",
  horarioChegadaSamu:"", horarioSaidaSamu:"", placaAmbu:"", prefixoAmbu:"",
  equipeSamu:[{nome:"",funcao:"",recrea:""}],
  horarioFinalizacao:"", cientes:[{nome:"",cargo:"",re:""}], observacoesFinais:"",
});

function loadDraft() {
  try { const s = localStorage.getItem(DRAFT_KEY); if(s) return JSON.parse(s); } catch {}
  return null;
}
function saveDraft(form) {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(form)); } catch {}
}
function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); localStorage.removeItem(STEP_KEY); } catch {}
}
function loadStep() {
  try { return parseInt(localStorage.getItem(STEP_KEY) || "0"); } catch { return 0; }
}
function saveStepLS(n) {
  try { localStorage.setItem(STEP_KEY, String(n)); } catch {}
}
function carregarHistorico() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch { return []; }
}
function salvarHistorico(lista) {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(lista)); } catch {}
}

async function copiarTexto(texto) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(texto); return true; } catch {}
  }
  const ta = document.createElement("textarea");
  ta.value = texto; ta.setAttribute("readonly","");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
  document.body.appendChild(ta);
  ta.focus(); ta.select(); ta.setSelectionRange(0,99999);
  const ok = document.execCommand("copy");
  document.body.removeChild(ta);
  return ok;
}

async function gerarComGroq(apiKey, form, terminal) {
  const inconsciente = form.consciente === "nao";
  const prompt = `Você é um agente especializado em redigir relatórios de ocorrências de mal súbito em terminais de transporte público.

Redija um relatório formal em português, em parágrafos corridos, sem listas, sem markdown, sem asteriscos e sem títulos. Linguagem institucional, objetiva e juridicamente segura.

REGRAS OBRIGATÓRIAS:
1. Nunca afirme diagnósticos médicos. Use "relatando", "queixando-se de", "apresentando" para sintomas de usuário consciente.
2. Se INCONSCIENTE: use apenas linguagem observacional. Nunca use "queixando-se". Nunca mencione aceite de condução.
3. Não mencione a idade no corpo do texto salvo se relevante.
4. Se CPF foi informado (diferente de "não informado"), OBRIGATORIAMENTE inclua no relatório junto ao RG assim: "portador do RG nº X e CPF nº Y". Nunca omita o CPF se ele foi fornecido.
5. Use "aceitou ser conduzido" (nunca "aceitando condução").
6. Se sinais vitais não foram aferidos, registre: "não foram aferidos os sinais vitais do usuário."
7. Encerramento objetivo, sem repetições.
8. Para inconsciente: SAMU como acionamento imediato e necessário.

${terminal ? "TERMINAL: " + terminal : ""}
CONSCIÊNCIA: ${inconsciente ? "INCONSCIENTE" : "CONSCIENTE"}

DADOS:
- Horário: ${form.horarioOcorrencia}
- Nome: ${form.nomeUsuario}
- RG: ${form.rgUsuario || "não informado"}
- CPF: ${form.cpfUsuario || "não informado"}
- Local: ${form.localOcorrencia}
- Identificação: ${form.quemChamou || "não informado"}

CLÍNICO:
- ${inconsciente ? "Observado pelos colaboradores" : "Situação relatada/observada"}: ${form.situacaoUsuario}
- Sinais vitais: ${form.sinaisVitais || "não aferidos"}
- Cadeira de rodas: ${form.precisaCadeira === "sim" ? "Sim" : "Não"}
${!inconsciente ? "- Consciência: " + (form.nivelConsciente || "consciente e orientado") + "\n- Condução: " + (form.aceitaConducao === "sim" ? "Aceitou" : form.aceitaConducao === "nao" ? "Recusou" : "N/A") : "- Inconsciente: sem consentimento"}
- Destino: ${form.hospitalDestino || "não informado"}

EQUIPE:
${form.equipe.filter(e=>e.nome).map(e=>"- " + e.cargo + ": " + e.nome + ", RE " + e.re).join("\n") || "- Não informado"}

SAMU:
${form.samuSolicitado === "sim"
  ? "- Solicitado: Sim\n- Contato: " + form.horarioSamuContato + "\n- Atendente: " + form.atendenteSamu + "\n- Protocolo: " + form.protocoloSamu + "\n- Chegada: " + form.horarioChegadaSamu + "\n- Saída: " + form.horarioSaidaSamu + "\n- Placa: " + form.placaAmbu + " | Prefixo: " + form.prefixoAmbu + "\n- Equipe: " + form.equipeSamu.filter(e=>e.nome).map(e=>e.funcao + " " + e.nome + ", RE/CREA " + e.recrea).join("; ")
  : "- Não solicitado"}

DESFECHO:
- Finalização: ${form.horarioFinalizacao || "não informado"}
- Observações: ${form.observacoesFinais || "nenhuma"}

CIENTES:
${form.cientes.filter(c=>c.nome).map(c=>"- " + c.cargo + " " + c.nome + " - RE " + c.re).join("\n") || "- Não informado"}

MODELO CONSCIENTE:
"Por volta das 22h00, o Sr. Marcos, portador do RG nº 9929990993 e CPF nº 123.456.789-00, foi identificado na Plataforma 1 após relatar fortes dores abdominais.
A equipe composta pelos OTUs Francisco, RE 0292, e Michele, RE 0294, prestou auxílio, encontrando-o consciente e orientado, tendo aceitado ser conduzido. Foi necessária cadeira de rodas. Não foram aferidos os sinais vitais do usuário.
Foi realizado contato com o SAMU às 22h15, registrado pela atendente Maria, protocolo nº 09999333.
Às 22h25, compareceu a viatura AMD-0925, placa AMD-0925, composta pelo médico Paulo, RE/CREA 9293, e enfermeira Carla, RE/COREN 93944. O usuário seria encaminhado ao Hospital M'Boi Mirim.
Ocorrência finalizada às 22h55.
Ciente: ET Alex Sandro - RE 05."

MODELO INCONSCIENTE:
"Por volta das 03h12, o Sr. José Lima, portador do RG nº 44.123.456-7, foi encontrado inconsciente na Plataforma 2.
Os colaboradores Vigilante Rafael, RE 1102, e OTU Cláudio, RE 0387, prestaram auxílio. O usuário encontrava-se inconsciente e sem resposta a estímulos verbais, apresentando respiração irregular. Não foram aferidos os sinais vitais.
Diante do estado de inconsciência, foi realizado contato imediato com o SAMU às 03h15, protocolo nº 20261102033.
Às 03h28, compareceu a viatura AM-1134, placa EKF-3391, com o médico Dr. Roberto, RE/CREA 88712, e enfermeira Tatiane, RE/COREN 54923. A equipe assumiu os cuidados, informando encaminhamento ao Hospital Geral de Pedreira.
Ocorrência finalizada às 03h45.
Ciente: Sup. Fernanda - RE 228."

Escreva APENAS o relatório. Sem markdown. Ao final: "Ocorrência finalizada às [horário]." e cientes.`;

  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer " + apiKey},
    body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"user",content:prompt}],temperature:0.3,max_tokens:1200})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  const text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if(!text) throw new Error("Resposta vazia.");
  return text.replace(/\*\*/g,"").replace(/\*/g,"").replace(/^#+\s/gm,"").trim();
}

function Inp({label, value, onChange, placeholder, type, hint}) {
  return (
    React.createElement("div", {className:"field"},
      React.createElement("label", null, label),
      hint && React.createElement("span", {className:"hint"}, hint),
      React.createElement("input", {type:type||"text", value:value, onChange:function(e){onChange(e.target.value)}, placeholder:placeholder||label})
    )
  );
}
function TA({label, value, onChange, placeholder, rows, hint}) {
  return (
    React.createElement("div", {className:"field"},
      React.createElement("label", null, label),
      hint && React.createElement("span", {className:"hint"}, hint),
      React.createElement("textarea", {rows:rows||3, value:value, onChange:function(e){onChange(e.target.value)}, placeholder:placeholder||label})
    )
  );
}
function Radio({label, value, options, onChange}) {
  return (
    React.createElement("div", {className:"field"},
      React.createElement("label", null, label),
      React.createElement("div", {className:"radio-group"},
        options.map(function(o) {
          return React.createElement("button", {
            key:o.v,
            className:"radio-btn" + (o.danger?" danger":"") + (value===o.v?" active":""),
            onClick:function(){onChange(o.v)},
            type:"button"
          }, o.l);
        })
      )
    )
  );
}
function DList({items, onChange, fields, addLabel}) {
  function add() { onChange(items.concat([fields.reduce(function(acc,f){acc[f.key]="";return acc;},{})])); }
  function rem(i) { onChange(items.filter(function(_,idx){return idx!==i;})); }
  function upd(i,k,v) { var a=items.slice(); a[i]=Object.assign({},a[i],{[k]:v}); onChange(a); }
  var cols = fields.length===2 ? "1fr 1fr" : "1fr 1fr 1fr";
  return (
