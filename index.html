<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0d0f14"/>
<title>Agente de Ocorrências</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0f14; --bg2: #111420; --border: #1e2330; --text: #c8cdd8;
  --text2: #7a8299; --text3: #3a4055; --blue: #4d8eff; --green: #4ac97a;
  --red: #ff6b6b; --red-bg: #1a0d0d; --red-border: #ff3b3b44;
  --green-bg: #0d2018; --green-border: #2a8a5a; --input-bg: #0d0f14;
}
.light {
  --bg: #f0f2f7; --bg2: #ffffff; --border: #d0d5e0; --text: #1a1f2e;
  --text2: #555e7a; --text3: #aab0c0; --blue: #2266dd; --green: #1a7a48;
  --red: #cc2222; --red-bg: #fff0f0; --red-border: #ffaaaa;
  --green-bg: #f0fff6; --green-border: #88ddaa; --input-bg: #f8f9fc;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; transition: background 0.2s, color 0.2s; }
.app { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
.header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; }
.header-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.header-right { display:flex; gap:8px; align-items:flex-start; }
.header-badge { display:inline-flex; align-items:center; gap:6px; background:#ff3b3b18; border:1px solid #ff3b3b44; color:#ff6b6b; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:4px 10px; border-radius:2px; margin-bottom:10px; }
.dot { width:6px; height:6px; background:#ff3b3b; border-radius:50%; animation:blink 1.4s ease-in-out infinite; display:inline-block; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }
h1 { font-size:21px; font-weight:600; color:var(--text); letter-spacing:-0.5px; }
h1 span { color:var(--blue); }
.subtitle { font-size:12px; color:var(--text3); margin-top:5px; font-family:'IBM Plex Mono',monospace; }
.oc-badge { display:inline-flex; align-items:center; background:#1a1a0d; border:1px solid #4a4a1a; color:#cccc44; font-family:'IBM Plex Mono',monospace; font-size:10px; padding:2px 8px; border-radius:2px; margin-top:6px; }
.light .oc-badge { background:#fffff0; border-color:#aaaa44; color:#888800; }
.btn-theme { background:none; border:1px solid var(--border); color:var(--text2); border-radius:4px; padding:7px 10px; font-size:14px; cursor:pointer; }
.btn-historico { background:none; border:1px solid var(--border); color:var(--text2); border-radius:4px; padding:7px 12px; font-size:12px; font-family:'IBM Plex Mono',monospace; cursor:pointer; white-space:nowrap; }
.btn-historico.ativo { border-color:var(--blue); color:var(--blue); background:var(--bg2); }
.groq-badge { display:inline-flex; align-items:center; gap:5px; background:var(--bg2); border:1px solid var(--border); color:var(--blue); font-family:'IBM Plex Mono',monospace; font-size:10px; padding:3px 8px; border-radius:2px; }
.draft-banner { background:var(--green-bg); border:1px solid var(--green-border); border-radius:4px; padding:8px 12px; margin-bottom:14px; font-size:12px; color:var(--green); font-family:'IBM Plex Mono',monospace; display:flex; justify-content:space-between; align-items:center; }
.draft-discard { background:none; border:none; color:var(--red); font-size:11px; cursor:pointer; }
.terminal-bar { background:var(--bg2); border:1px solid var(--border); border-radius:4px; padding:10px 14px; margin-bottom:18px; display:flex; align-items:center; gap:10px; }
.terminal-bar label { font-size:11px; color:var(--blue); font-family:'IBM Plex Mono',monospace; white-space:nowrap; text-transform:uppercase; letter-spacing:1px; }
.terminal-bar input { background:transparent; border:none; border-bottom:1px solid var(--border); border-radius:0; padding:3px 0; font-size:13px; color:var(--text); font-family:'IBM Plex Mono',monospace; outline:none; width:100%; }
.step-nav { display:flex; margin-bottom:24px; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
.step-pill { flex:1; padding:8px 4px; text-align:center; font-size:10px; font-family:'IBM Plex Mono',monospace; color:var(--text3); border-right:1px solid var(--border); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.step-pill:last-child { border-right:none; }
.step-pill.done { color:#2a8a5a; background:var(--green-bg); }
.step-pill.active { color:var(--blue); background:var(--bg2); font-weight:600; }
.card { background:var(--bg2); border:1px solid var(--border); border-radius:6px; padding:22px; margin-bottom:18px; }
.card-title { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--blue); letter-spacing:2px; text-transform:uppercase; margin-bottom:18px; display:flex; align-items:center; gap:8px; }
.card-title::after { content:''; flex:1; height:1px; background:var(--border); }
.field { margin-bottom:14px; }
.field label { display:block; font-size:11px; font-weight:500; color:var(--text2); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.8px; }
.hint { font-size:11px; color:var(--text3); margin-bottom:5px; font-style:italic; display:block; }
input, textarea, select { width:100%; background:var(--input-bg); border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:'IBM Plex Sans',sans-serif; font-size:16px; padding:10px 12px; outline:none; -webkit-appearance:none; transition:border-color 0.2s; }
input:focus, textarea:focus { border-color:var(--blue); }
input::placeholder, textarea::placeholder { color:var(--text3); }
textarea { resize:vertical; line-height:1.6; }
.row-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.radio-group { display:flex; gap:8px; flex-wrap:wrap; }
.radio-btn { padding:9px 14px; background:var(--input-bg); border:1px solid var(--border); border-radius:4px; color:var(--text2); font-size:13px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; -webkit-tap-highlight-color:transparent; transition:all 0.15s; }
.radio-btn.active { background:var(--bg2); border-color:var(--blue); color:var(--blue); }
.radio-btn.danger { border-color:var(--red-border); color:#cc4444; }
.radio-btn.danger.active { background:var(--red-bg); border-color:var(--red); color:var(--red); }
.dynamic-list { display:flex; flex-direction:column; gap:10px; }
.list-item { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:12px; }
.list-item-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text3); }
.list-item-fields { display:grid; gap:8px; }
.list-item .field { margin-bottom:0; }
.remove-btn { background:none; border:1px solid var(--red-border); color:#7a3a3a; border-radius:3px; width:22px; height:22px; cursor:pointer; font-size:10px; }
.add-btn { background:none; border:1px dashed var(--border); color:var(--text3); border-radius:4px; padding:9px; width:100%; cursor:pointer; font-size:12px; font-family:'IBM Plex Mono',monospace; transition:all 0.15s; }
.add-btn:hover { border-color:var(--blue); color:var(--blue); }
.nav { display:flex; justify-content:space-between; gap:12px; }
.btn { padding:12px 24px; border-radius:4px; font-size:14px; font-weight:500; cursor:pointer; border:none; font-family:'IBM Plex Sans',sans-serif; -webkit-tap-highlight-color:transparent; }
.btn-ghost { background:none; border:1px solid var(--border); color:var(--text2); }
.btn-ghost:disabled { opacity:0.3; cursor:not-allowed; }
.btn-primary { background:var(--blue); color:#fff; }
.btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
.btn-gerar { background:#1a3a5a; color:#fff; width:100%; padding:14px; font-size:14px; font-weight:600; border:none; border-radius:4px; cursor:pointer; }
.light .btn-gerar { background:var(--blue); }
.loading { display:flex; align-items:center; gap:10px; color:var(--blue); font-family:'IBM Plex Mono',monospace; font-size:12px; padding:20px 0; }
.spinner { width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.relatorio-edit-wrap { position:relative; margin:14px 0; }
.relatorio-textarea { width:100%; background:var(--bg); border:1px solid var(--green-border); border-radius:4px; padding:18px; font-size:14px; line-height:1.9; color:var(--text); font-family:'IBM Plex Sans',sans-serif; resize:vertical; outline:none; min-height:200px; }
.edit-badge { position:absolute; top:8px; right:8px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text3); background:var(--bg2); border:1px solid var(--border); padding:2px 8px; border-radius:2px; pointer-events:none; }
.action-bar { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.btn-whatsapp { background:#0d2a1a; border:1px solid #25d36644; color:#25d366; padding:12px; border-radius:4px; font-size:13px; font-family:'IBM Plex Mono',monospace; cursor:pointer; text-align:center; width:100%; }
.light .btn-whatsapp { background:#e8fff2; border-color:#25d36688; }
.btn-pdf { background:var(--bg2); border:1px solid var(--blue); color:var(--blue); padding:12px; border-radius:4px; font-size:13px; font-family:'IBM Plex Mono',monospace; cursor:pointer; text-align:center; width:100%; }
.btn-reset { background:none; border:1px solid var(--border); color:var(--text2); padding:10px; border-radius:4px; font-size:12px; font-family:'IBM Plex Mono',monospace; cursor:pointer; text-align:center; width:100%; }
.samu-section { border-top:1px solid var(--border); padding-top:18px; margin-top:4px; }
.api-key-box { background:var(--bg2); border:1px solid #4d8eff33; border-radius:6px; padding:18px; margin-bottom:18px; }
.api-key-box p { font-size:13px; color:var(--text2); margin-bottom:10px; line-height:1.7; }
.api-key-box a { color:var(--blue); }
.key-row { display:flex; gap:8px; }
.btn-save { background:var(--blue); color:#fff; border:none; border-radius:4px; padding:10px 16px; font-size:13px; cursor:pointer; white-space:nowrap; }
.btn-save:disabled { opacity:0.4; cursor:not-allowed; }
.key-change { font-size:11px; color:var(--text3); cursor:pointer; font-family:'IBM Plex Mono',monospace; background:none; border:none; text-decoration:underline; margin-bottom:14px; display:block; }
.alerta { background:var(--red-bg); border:1px solid var(--red-border); border-radius:4px; padding:10px 12px; margin-bottom:14px; font-size:13px; color:var(--red); line-height:1.6; }
.alerta strong { color:var(--red); }
.erro { color:var(--red); font-size:13px; padding:12px; background:var(--red-bg); border:1px solid var(--red-border); border-radius:4px; line-height:1.6; }
.toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--green-bg); border:1px solid var(--green-border); color:var(--green); font-family:'IBM Plex Mono',monospace; font-size:13px; padding:10px 24px; border-radius:6px; z-index:999; white-space:nowrap; box-shadow:0 4px 20px #00000044; }
.hist-vazio { text-align:center; padding:32px; color:var(--text3); font-family:'IBM Plex Mono',monospace; font-size:13px; }
.hist-item { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:14px; margin-bottom:10px; }
.hist-item-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
.hist-item-nome { font-weight:600; color:var(--text); font-size:14px; }
.hist-item-oc { font-family:'IBM Plex Mono',monospace; font-size:10px; color:#cccc44; }
.hist-item-data { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text3); }
.hist-item-meta { font-size:12px; color:var(--text2); line-height:1.6; }
.hist-item-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.btn-hist-ver { background:var(--bg2); border:1px solid var(--blue); color:var(--blue); padding:6px 12px; border-radius:3px; font-size:11px; font-family:'IBM Plex Mono',monospace; cursor:pointer; }
.btn-hist-del { background:none; border:1px solid var(--red-border); color:#7a3a3a; padding:6px 12px; border-radius:3px; font-size:11px; font-family:'IBM Plex Mono',monospace; cursor:pointer; }
.hist-count { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text3); margin-bottom:14px; }
.modal-overlay { position:fixed; inset:0; background:#00000099; z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
.modal { background:var(--bg2); border:1px solid var(--border); border-radius:8px; max-width:680px; width:100%; max-height:90vh; overflow-y:auto; padding:22px; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.modal-title { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--blue); font-weight:600; letter-spacing:1px; }
.modal-close { background:none; border:1px solid var(--border); color:var(--text2); border-radius:3px; width:28px; height:28px; cursor:pointer; font-size:14px; }
.foto-upload-area { border:1px dashed var(--border); border-radius:4px; padding:14px; text-align:center; cursor:pointer; margin-bottom:8px; }
.foto-upload-label { font-size:12px; color:var(--text3); font-family:'IBM Plex Mono',monospace; display:block; cursor:pointer; }
.foto-upload-label input { display:none; }
.foto-preview-wrap { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.foto-preview { position:relative; border-radius:4px; overflow:hidden; border:1px solid var(--border); }
.foto-preview img { width:100%; height:110px; object-fit:cover; display:block; }
.foto-remove { position:absolute; top:4px; right:4px; background:var(--red-bg); border:1px solid var(--red-border); color:var(--red); border-radius:3px; width:22px; height:22px; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; }
.fotos-label { font-size:11px; font-weight:500; color:var(--text2); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.8px; display:block; }
@media(max-width:540px){ .row-2{grid-template-columns:1fr} .step-pill{font-size:8px;padding:5px 2px} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const STEPS = ["Dados","Clínico","Equipe","SAMU","Desfecho","Relatório"];
const HIST_KEY = "ocorrencias_historico";
const TERM_KEY = "ocorrencias_terminal";
const GROQ_KEY = "groq_key";
const DRAFT_KEY = "ocorrencias_rascunho";
const STEP_KEY = "ocorrencias_step";
const OC_COUNTER_KEY = "ocorrencias_contador";
const THEME_KEY = "ocorrencias_tema";

function horaAtual() {
  var d = new Date();
  return String(d.getHours()).padStart(2,"0")+"h"+String(d.getMinutes()).padStart(2,"0");
}
function proximoOC() {
  try {
    var n = parseInt(localStorage.getItem(OC_COUNTER_KEY)||"0") + 1;
    localStorage.setItem(OC_COUNTER_KEY, String(n));
    return "OC-"+String(n).padStart(3,"0");
  } catch { return "OC-001"; }
}
function ls(key, def) { try { return localStorage.getItem(key)||def; } catch { return def; } }
function lsSet(key, val) { try { localStorage.setItem(key, val); } catch {} }
function lsRemove(key) { try { localStorage.removeItem(key); } catch {} }
function loadJSON(key, def) { try { var v=localStorage.getItem(key); return v?JSON.parse(v):def; } catch { return def; } }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

function emptyForm() {
  return {
    horarioOcorrencia:horaAtual(), nomeUsuario:"", rgUsuario:"", cpfUsuario:"", idadeUsuario:"",
    localOcorrencia:"", quemChamou:"", sinaisVitais:"", situacaoUsuario:"",
    precisaCadeira:"nao", consciente:"sim", nivelConsciente:"", aceitaConducao:"sim",
    hospitalDestino:"", numeroOC:"",
    equipe:[{nome:"",cargo:"",re:""}],
    samuSolicitado:"nao", horarioSamuContato:"", atendenteSamu:"", protocoloSamu:"",
    horarioChegadaSamu:"", horarioSaidaSamu:"", placaAmbu:"", prefixoAmbu:"",
    equipeSamu:[{nome:"",funcao:"",recrea:""}],
    horarioFinalizacao:"", cientes:[{nome:"",cargo:"",re:""}], observacoesFinais:"", fotos:[],
  };
}

async function copiarTexto(texto) {
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Clipboard) {
    try { await window.Capacitor.Plugins.Clipboard.write({string:texto}); return true; } catch {}
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(texto); return true; } catch {}
  }
  var ta = document.createElement("textarea");
  ta.value = texto; ta.setAttribute("readonly","");
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px;";
  document.body.appendChild(ta);
  ta.focus(); ta.select(); ta.setSelectionRange(0,99999);
  var ok = document.execCommand("copy");
  document.body.removeChild(ta);
  return ok;
}

function gerarPDF(relatorio, fotos, terminal, nomeUsuario, numeroOC) {
  var fotosHtml = "";
  if (fotos && fotos.length > 0) {
    fotosHtml = '<div style="margin-top:32px;page-break-before:auto;"><div style="font-size:9pt;font-family:sans-serif;text-transform:uppercase;letter-spacing:2px;color:#666;border-bottom:1px solid #ccc;padding-bottom:6px;margin-bottom:16px;">Registros Fotográficos</div><table width="100%" cellpadding="8" cellspacing="0"><tr>';
    fotos.forEach(function(foto, i) {
      fotosHtml += '<td width="50%" style="text-align:center;vertical-align:top;"><img src="'+foto.data+'" style="max-width:100%;max-height:200px;border:1px solid #ddd;border-radius:4px;" alt="Foto '+(i+1)+'"/><div style="font-size:9pt;color:#666;margin-top:6px;font-family:sans-serif;">Foto '+(i+1)+'</div></td>';
    });
    fotosHtml += '</tr></table></div>';
  }
  var htmlContent = [
    '<!DOCTYPE html><html><head><meta charset="UTF-8"/>',
    '<style>',
    '* { box-sizing: border-box; margin: 0; padding: 0; }',
    'html, body { width: 210mm; }',
    '@page { size: A4; margin: 20mm 20mm 20mm 20mm; }',
    '@media print { html, body { width: 210mm; } .no-print { display: none !important; } }',
    'body { font-family: "Times New Roman", Times, serif; font-size: 12pt; line-height: 1.8; color: #000; padding: 0; }',
    '.wrapper { max-width: 170mm; margin: 0 auto; }',
    '.print-btn { display: block; width: 100%; padding: 12px; margin-bottom: 24px; background: #1a3a5a; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-family: sans-serif; font-weight: 600; }',
    'h2 { font-size: 14pt; text-align: center; margin-bottom: 4px; font-family: Arial, sans-serif; font-weight: bold; }',
    '.sub { text-align: center; font-size: 10pt; color: #444; margin-bottom: 24px; border-bottom: 2px solid #000; padding-bottom: 10px; font-family: Arial, sans-serif; }',
    '.body-text { white-space: pre-wrap; text-align: justify; font-size: 12pt; line-height: 1.8; }',
    '</style></head><body>',
    '<div class="wrapper">',
    '<button class="print-btn no-print" onclick="window.print(); return false;">⬇ Salvar como PDF</button>',
    '<h2>'+(terminal||"Relatório de Ocorrência")+'</h2>',
    '<div class="sub">'+(numeroOC?'<strong>'+numeroOC+'</strong> · ':'')+nomeUsuario+' &mdash; '+new Date().toLocaleDateString("pt-BR")+' '+new Date().toLocaleTimeString("pt-BR")+'</div>',
    '<p class="body-text">'+relatorio.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</p>',
    fotosHtml,
    '</div></body></html>'
  ].join("");

  var blob = new Blob([htmlContent], {type: "text/html;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = (numeroOC || "relatorio") + "-ocorrencia.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
}

async function gerarComGroq(apiKey, form, terminal) {
  var inconsciente = form.consciente === "nao";
  var linhasEquipe = form.equipe.filter(function(e){return e.nome;}).map(function(e){return "- "+e.cargo+": "+e.nome+", RE "+e.re;}).join("\n") || "- Não informado";
  var linhaSamu = form.samuSolicitado === "sim"
    ? "- Solicitado: Sim\n- Contato: "+form.horarioSamuContato+"\n- Atendente: "+form.atendenteSamu+"\n- Protocolo: "+form.protocoloSamu+"\n- Chegada: "+form.horarioChegadaSamu+"\n- Saída: "+form.horarioSaidaSamu+"\n- Placa: "+form.placaAmbu+" | Prefixo: "+form.prefixoAmbu+"\n- Equipe: "+form.equipeSamu.filter(function(e){return e.nome;}).map(function(e){return e.funcao+" "+e.nome+", RE/CREA "+e.recrea;}).join("; ")
    : "- Não solicitado";
  var linhasCientes = form.cientes.filter(function(c){return c.nome;}).map(function(c){return "- "+c.cargo+" "+c.nome+" - RE "+c.re;}).join("\n") || "- Não informado";
